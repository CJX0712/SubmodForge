[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SubmodForge"
version = "0.1.0"
description = "World-class submodular optimization library with provable (1-1/e) guarantees"
authors = [{ name = "晨星" }]
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning"

[tool.setuptools]
packages = ["core", "submod", "maximize", "minimize", "data", "eval", "pipeline"]
