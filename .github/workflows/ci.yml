name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.3
      - name: Lint (syntax)
        run: |
          python -m compileall -q core submod maximize minimize data eval pipeline cli.py examples
      - name: Run pytest
        run: python -m pytest -q -W ignore::UserWarning
      - name: Demo smoke (determinism + benchmark)
        run: python examples/run_demo.py
